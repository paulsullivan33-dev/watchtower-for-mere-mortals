site_name: Watchtower for Mere Mortals
site_description: A program that keeps your Docker containers updated by itself. How Watchtower notices a new image, swaps the container for a fresh one with the same settings, chooses what it may touch, and reports what it did — including which of the two Watchtower projects is the living one, and the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/watchtower-for-mere-mortals/
